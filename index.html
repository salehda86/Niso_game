<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Heist Run</title>
<style>
  :root { --bg:#14161c; --ink:#e9e6dc; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:"Trebuchet MS", "Segoe UI", Verdana, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  canvas { display:block; background:#6fae4f; touch-action:none; }
  #rotate { position:fixed; inset:0; background:#14161c; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; text-align:center; font-size:20px; z-index:5; padding:20px; }
  #rotate b { font-size:46px; }
  #help { font-size:14px; opacity:.85; text-align:center; padding:0 12px; }
  kbd { background:#2b2f3a; border:1px solid #444a58; border-radius:4px; padding:0 5px; font-family:inherit; }
</style>
</head>
<body>
<canvas id="c" width="960" height="640"></canvas>
<div id="rotate"><b>&#8635;</b>Rotate your phone to landscape to play</div>
<div id="help"><kbd>WASD</kbd>/<kbd>Arrows</kbd> move · <kbd>Space</kbd> gun · <kbd>Ctrl</kbd> or <kbd>Q</kbd> sword · <kbd>Shift</kbd> get in/out of a car · walk past the shop to buy (<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>, <kbd>Enter</kbd> to leave)</div>
<script>
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 960, H = 640;
const WW = 3600, WH = 2400;
const PRICE = { gun: 60, sword: 100, car: 200 };
const FREEZE = 5, SWORD_RESPAWN = 8, CAR_MAX_HP = 5;

// ---------- world layout ----------
const roadsH = [{x:0,y:580,w:WW,h:100},{x:0,y:1150,w:WW,h:120},{x:0,y:1760,w:WW,h:100}];
const roadsV = [{x:880,y:0,w:100,h:WH},{x:1740,y:0,w:120,h:WH},{x:2680,y:0,w:100,h:WH}];
const roads = roadsH.concat(roadsV);
const shopB = {x:1900,y:950,w:260,h:170};
const zone  = {x:1900,y:1124,w:260,h:64};
const XS = [[0,880],[980,1740],[1860,2680],[2780,3600]], YS = [[0,580],[680,1150],[1270,1760],[1860,2400]];
const walls = [shopB], trees = [], cars = [], peds = [], lanes = [];
let ground;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R = mulberry32(21);
const rr = (a,b) => a + R()*(b-a);
const rnd = (a,b) => a + Math.random()*(b-a);
const ov = (a,b,pad=0) => a.x-pad<b.x+b.w && a.x+a.w+pad>b.x && a.y-pad<b.y+b.h && a.y+a.h+pad>b.y;
const blocked = (r,pad) => ov(r,shopB,pad+10) || ov(r,zone,pad) || walls.some(o=>ov(r,o,pad));
const CAR_COLORS = ['#d0d4da','#2f3a4a','#b8352f','#e0b53a','#3a7a5a','#4b6fb5','#7b4a8a','#e8e8e8','#1c1c1f'];
const SHIRTS = ['#d9534f','#4a90d9','#f0ad4e','#5cb85c','#9b59b6','#ecf0f1','#e67e22','#16a085'];
function addCar(x,y,a) { cars.push({x,y,a,hp:CAR_MAX_HP,color:CAR_COLORS[Math.floor(R()*CAR_COLORS.length)]}); }
function pieces(total, cuts) { let s=0, out=[]; for (const [a,b] of cuts) { if (a>s) out.push([s,a]); s=b; } if (s<total) out.push([s,total]); return out; }

function drawTree(x, t) {
  x.fillStyle='#0003'; x.beginPath(); x.ellipse(t.x+6,t.y+9,22*t.s,18*t.s,0,0,7); x.fill();
  x.fillStyle='#2f7a3a'; x.beginPath(); x.arc(t.x,t.y,21*t.s,0,7); x.fill();
  x.fillStyle='#3f9a4a'; x.beginPath(); x.arc(t.x-4,t.y-5,14*t.s,0,7); x.fill();
  x.fillStyle='#58b55e'; x.beginPath(); x.arc(t.x-7,t.y-8,7*t.s,0,7); x.fill();
}
function addTrees(x, c, n, pad) {
  for (let i=0, k=0; i<n*6 && k<n; i++) {
    const tx = rr(c.x+20,c.x+c.w-20), ty = rr(c.y+20,c.y+c.h-20), r = {x:tx-17,y:ty-17,w:34,h:34};
    if (blocked(r,pad)) continue;
    const t = {x:tx,y:ty,s:rr(.85,1.2)}; trees.push(t); walls.push(r); k++;
  }
}

function buildWorld() {
  ground = document.createElement('canvas'); ground.width = WW; ground.height = WH;
  const x = ground.getContext('2d');
  x.fillStyle = '#6fae4f'; x.fillRect(0,0,WW,WH);
  for (let i=0;i<1100;i++) { x.globalAlpha=.3; x.fillStyle = R()<.5?'#7dbb5a':'#5f9f45';
    x.beginPath(); x.ellipse(rr(0,WW),rr(0,WH),rr(30,130),rr(20,80),0,0,7); x.fill(); }
  x.globalAlpha=.4; x.strokeStyle='#4d8a38'; x.lineWidth=1.5;
  for (let i=0;i<8000;i++) { const a=rr(0,WW), b=rr(0,WH); x.beginPath(); x.moveTo(a,b); x.lineTo(a+rr(-2,2),b-rr(4,8)); x.stroke(); }
  x.globalAlpha=1;

  // city blocks
  const cells = [];
  for (let j=0;j<4;j++) for (let i=0;i<4;i++) {
    const x0=XS[i][0]+(i?30:20), x1=XS[i][1]-(i<3?30:20), y0=YS[j][0]+(j?30:20), y1=YS[j][1]-(j<3?30:20);
    const u = R(), type = (i===2&&j===1) ? 'houses' : u<.4?'houses':u<.65?'comm':u<.85?'park':'lot';
    cells.push({x:x0,y:y0,w:x1-x0,h:y1-y0,type});
  }
  const base = {houses:'#76b455', comm:'#a9a69c', park:'#84c05f', lot:'#56595f'};
  for (const c of cells) { x.fillStyle = base[c.type]; x.fillRect(c.x,c.y,c.w,c.h);
    if (c.type!=='houses') { x.strokeStyle='#0002'; x.lineWidth=2; x.strokeRect(c.x,c.y,c.w,c.h); } }

  // roads: sidewalks, asphalt, markings
  for (const r of roads) { x.fillStyle='#c8c4b4'; x.fillRect(r.x-14,r.y-14,r.w+28,r.h+28); }
  for (const r of roads) { x.fillStyle='#4c4f57'; x.fillRect(r.x,r.y,r.w,r.h); }
  for (let i=0;i<9000;i++) { x.fillStyle = R()<.5?'#ffffff08':'#00000010'; const r=roads[Math.floor(R()*roads.length)];
    x.fillRect(r.x+R()*r.w, r.y+R()*r.h, rr(2,6), rr(2,6)); }
  for (const r of roadsH) {
    for (const [a,b] of pieces(WW, roadsV.map(v=>[v.x-34,v.x+v.w+34]))) {
      const cy = r.y+r.h/2; x.fillStyle='#f2c14e'; x.fillRect(a,cy-3,b-a,2); x.fillRect(a,cy+1,b-a,2);
      x.fillStyle='#d8d6cc'; x.fillRect(a,r.y+26,b-a,2); x.fillRect(a,r.y+r.h-28,b-a,2); }
  }
  for (const r of roadsV) {
    for (const [a,b] of pieces(WH, roadsH.map(h=>[h.y-34,h.y+h.h+34]))) {
      const cx = r.x+r.w/2; x.fillStyle='#f2c14e'; x.fillRect(cx-3,a,2,b-a); x.fillRect(cx+1,a,2,b-a);
      x.fillStyle='#d8d6cc'; x.fillRect(r.x+26,a,2,b-a); x.fillRect(r.x+r.w-28,a,2,b-a); }
  }
  x.fillStyle='#e9e6dc';
  for (const h of roadsH) for (const v of roadsV) {
    for (let k=v.x+8;k<v.x+v.w-8;k+=14) { x.fillRect(k,h.y-32,8,22); x.fillRect(k,h.y+h.h+10,8,22); }
    for (let k=h.y+8;k<h.y+h.h-8;k+=14) { x.fillRect(v.x-32,k,22,8); x.fillRect(v.x+v.w+10,k,22,8); }
  }

  // shop plaza
  x.fillStyle='#bdb9a9'; x.fillRect(shopB.x-24,shopB.y-24,shopB.w+48,1150-(shopB.y-24));

  // block contents
  for (const c of cells) {
    if (c.type==='houses') {
      const lw=190, lh=160, cols=Math.floor(c.w/lw), rows=Math.floor(c.h/lh);
      const ox=c.x+(c.w-cols*lw)/2, oy=c.y+(c.h-rows*lh)/2;
      const roofs = ['#b5503c','#7a5c8f','#c98b3a','#4f7d9a','#8a3b3b','#5b7f5b'];
      for (let a=0;a<cols;a++) for (let b=0;b<rows;b++) {
        const L = {x:ox+a*lw,y:oy+b*lh}, hw=rr(100,130), hh=rr(80,100);
        const h = {x:L.x+(lw-hw)/2+rr(-8,8), y:L.y+22, w:hw, h:hh};
        if (R()<.1 || blocked(h,14)) continue;
        walls.push(h);
        x.strokeStyle='#0000001a'; x.lineWidth=1; x.strokeRect(L.x+2,L.y+2,lw-4,lh-4);
        x.fillStyle='#aaa79c'; x.fillRect(h.x+10,h.y+hh,24,L.y+lh-h.y-hh);
        x.fillStyle='#0003'; x.fillRect(h.x+8,h.y+8,hw,hh);
        x.fillStyle='#e3d9bf'; x.fillRect(h.x,h.y,hw,hh);
        x.fillStyle=roofs[Math.floor(R()*roofs.length)]; x.fillRect(h.x+5,h.y+5,hw-10,hh-10);
        x.fillStyle='#0003'; x.fillRect(h.x+5,h.y+hh/2,hw-10,(hh-10)/2);
        x.fillStyle='#ffffff25'; x.fillRect(h.x+5,h.y+5,hw-10,4);
        x.fillStyle='#5a4a40'; x.fillRect(h.x+hw-36,h.y+14,14,14);
      }
      addTrees(x, c, 6, 20);
    } else if (c.type==='comm') {
      const n = 2 + Math.floor(R()*2), cw = (c.w-(n-1)*30)/n;
      const rc = ['#8d9099','#a38f7a','#7f8c94','#9a9aa3'];
      for (let k=0;k<n;k++) {
        const bw=cw*rr(.7,.95), bh=c.h*rr(.55,.85), b={x:c.x+k*(cw+30)+(cw-bw)/2, y:c.y+(c.h-bh)/2, w:bw, h:bh};
        if (blocked(b,0)) continue;
        walls.push(b);
        x.fillStyle='#0004'; x.fillRect(b.x+10,b.y+10,b.w,b.h);
        x.fillStyle='#d8d4c8'; x.fillRect(b.x,b.y,b.w,b.h);
        x.fillStyle=rc[Math.floor(R()*rc.length)]; x.fillRect(b.x+6,b.y+6,b.w-12,b.h-12);
        x.fillStyle='#ffffff20'; x.fillRect(b.x+6,b.y+6,b.w-12,5);
        x.fillStyle='#5d6068'; for (let q=0;q<4;q++) x.fillRect(b.x+rr(20,b.w-50),b.y+rr(20,b.h-40),26,18);
        x.strokeStyle='#0003'; x.lineWidth=2; x.strokeRect(b.x+b.w*.3,b.y+b.h*.3,b.w*.4,b.h*.4);
      }
    } else if (c.type==='park') {
      x.strokeStyle='#d9c9a0'; x.lineWidth=14; x.lineCap='round';
      x.beginPath(); x.moveTo(c.x+10,c.y+10); x.lineTo(c.x+c.w-10,c.y+c.h-10); x.moveTo(c.x+c.w-10,c.y+10); x.lineTo(c.x+10,c.y+c.h-10); x.stroke();
      x.beginPath(); x.ellipse(c.x+c.w/2,c.y+c.h/2,c.w*.22,c.h*.22,0,0,7); x.stroke(); x.lineCap='butt';
      if (R()<.6) { const pd={x:c.x+c.w/2-80,y:c.y+c.h/2-50,w:160,h:100}; walls.push(pd);
        x.fillStyle='#d8cfa8'; x.beginPath(); x.ellipse(c.x+c.w/2,c.y+c.h/2,92,62,0,0,7); x.fill();
        x.fillStyle='#3d8fc4'; x.beginPath(); x.ellipse(c.x+c.w/2,c.y+c.h/2,80,50,0,0,7); x.fill();
        x.strokeStyle='#8fd0f0'; x.lineWidth=2; x.beginPath(); x.ellipse(c.x+c.w/2-15,c.y+c.h/2-8,22,6,0,0,Math.PI); x.stroke(); }
      x.fillStyle='#7a5a3a'; for (let k=0;k<6;k++) x.fillRect(c.x+rr(30,c.w-60),c.y+rr(30,c.h-40),24,8);
      addTrees(x, c, 28, 16);
    } else {
      x.fillStyle='#d8d6cc';
      const rows = [c.y+18, c.y+c.h-18-46, c.y+c.h/2-46, c.y+c.h/2];
      for (const ry of rows) for (let sx=c.x+16; sx<c.x+c.w-26; sx+=26) {
        x.fillRect(sx,ry,2,46);
        if (R()<.3 && cars.length<18) addCar(sx+14, ry+23, R()<.5?Math.PI/2:-Math.PI/2);
      }
    }
  }
  for (const t of trees) drawTree(x, t);

  // shop building
  const s = shopB;
  x.fillStyle='#0003'; x.fillRect(s.x+10,s.y+10,s.w,s.h);
  x.fillStyle='#8f3d33'; x.fillRect(s.x,s.y,s.w,s.h);
  x.strokeStyle='#6e2d26'; x.lineWidth=1;
  for (let yy=s.y+10; yy<s.y+s.h; yy+=14) { x.beginPath(); x.moveTo(s.x,yy); x.lineTo(s.x+s.w,yy); x.stroke(); }
  x.fillStyle='#3a3f4a'; x.fillRect(s.x+8,s.y+8,s.w-16,s.h-52);
  x.fillStyle='#14161c'; x.fillRect(s.x+14,s.y+14,s.w-28,44);
  x.fillStyle='#f2c14e'; x.font='bold 26px Impact, "Arial Black", sans-serif'; x.textAlign='center';
  x.fillText('BLACK MARKET', s.x+s.w/2, s.y+45);
  x.fillStyle='#e9e6dc'; x.font='13px "Trebuchet MS", sans-serif';
  x.fillText('guns · swords · getaway cars', s.x+s.w/2, s.y+80);
  for (let i=0;i<13;i++) { x.fillStyle = i%2?'#f1ede0':'#c23b3b'; x.fillRect(s.x+i*20,s.y+s.h-44,20,40); }
  x.fillStyle='#0004'; x.fillRect(s.x,s.y+s.h-6,s.w,6);
  x.fillStyle='#f2c14e44'; x.fillRect(zone.x,zone.y,zone.w,zone.h);

  // street lamps
  x.fillStyle='#3b3e46';
  const lamp = (lx,ly) => { x.globalAlpha=.3; x.fillStyle='#000'; x.beginPath(); x.arc(lx+3,ly+3,4,0,7); x.fill(); x.globalAlpha=1;
    x.fillStyle='#3b3e46'; x.beginPath(); x.arc(lx,ly,4,0,7); x.fill(); x.fillStyle='#ffe9a0'; x.beginPath(); x.arc(lx,ly,1.8,0,7); x.fill(); };
  for (const r of roadsH) for (let lx=140; lx<WW; lx+=200) { lamp(lx,r.y-9); lamp(lx+100,r.y+r.h+9); }
  for (const r of roadsV) for (let ly=140; ly<WH; ly+=200) { lamp(r.x-9,ly); lamp(r.x+r.w+9,ly+100); }

  // parked cars along the curb
  for (const r of roadsH) for (let cx=200; cx<WW-200; cx+=140) {
    if (roadsV.some(v=>Math.abs(cx-(v.x+v.w/2))<v.w/2+90) || R()>.12) continue;
    addCar(cx, R()<.5 ? r.y+13 : r.y+r.h-13, R()<.5?0:Math.PI);
  }
  for (const r of roadsV) for (let cy=200; cy<WH-200; cy+=140) {
    if (roadsH.some(h=>Math.abs(cy-(h.y+h.h/2))<h.h/2+90) || R()>.12) continue;
    addCar(R()<.5 ? r.x+13 : r.x+r.w-13, cy, R()<.5?Math.PI/2:-Math.PI/2);
  }
  // pedestrians walk the sidewalks
  const paths = [];
  for (const r of roadsH) { paths.push({ax:'h',c:r.y-7}, {ax:'h',c:r.y+r.h+7}); }
  for (const r of roadsV) { paths.push({ax:'v',c:r.x-7}, {ax:'v',c:r.x+r.w+7}); }
  for (let i=0;i<95;i++) {
    const pa = paths[Math.floor(R()*paths.length)], len = pa.ax==='h'?WW:WH, along = rr(30,len-30);
    peds.push({ x:pa.ax==='h'?along:pa.c, y:pa.ax==='h'?pa.c:along, ax:pa.ax, dir:R()<.5?1:-1,
      sp:rr(28,48), col:SHIRTS[Math.floor(R()*SHIRTS.length)], stun:0, ph:rr(0,6), r:8 });
  }
}

// ---------- state ----------
let state='start', best=0, overAt=0, shopLock=false;
let p, cops, cash, t, spawnT, copT, msgs, fx, inv, keys={}, cam={x:0,y:0};
let touchMode = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches), portrait = false, copCarSaid = false;
const joy = {on:false, id:null, cx:0, cy:0, x:0, y:0, dx:0, dy:0};

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const carHit = (c,x,y,r) => { const h = Math.abs(Math.cos(c.a))>Math.abs(Math.sin(c.a)), hw=h?22:11, hh=h?11:22;
  return x+r>c.x-hw && x-r<c.x+hw && y+r>c.y-hh && y-r<c.y+hh; };
const hitsWall = (x,y,r) => walls.some(w => x+r>w.x && x-r<w.x+w.w && y+r>w.y && y-r<w.y+w.h)
  || cars.some(c => c!==p.car && carHit(c,x,y,r));
const inZone = () => p.x>zone.x && p.x<zone.x+zone.w && p.y>zone.y && p.y<zone.y+zone.h;

function move(e, dx, dy) {
  const ox=e.x, oy=e.y;
  const nx = Math.min(WW-e.r, Math.max(e.r, e.x+dx));
  if (!hitsWall(nx, e.y, e.r)) e.x = nx;
  const ny = Math.min(WH-e.r, Math.max(e.r, e.y+dy));
  if (!hitsWall(e.x, ny, e.r)) e.y = ny;
  return Math.hypot(e.x-ox, e.y-oy);
}
function spotAround(cx, cy, r, d0, d1) {
  for (let i=0;i<80;i++) {
    const a = rnd(0,6.283), d = rnd(d0,d1), x = cx+Math.cos(a)*d, y = cy+Math.sin(a)*d;
    if (x>40 && x<WW-40 && y>40 && y<WH-40 && !hitsWall(x,y,r+6)) return {x,y};
  }
  return {x:cx,y:cy};
}
function rollMounted(c) {
  c.mounted = t>=10 && Math.random() < Math.min(.8, .3+t/150); c.r = c.mounted ? 15 : 12;
  if (c.mounted && !copCarSaid) { copCarSaid = true; say('Cops are now chasing in police cars!', '#a9c8ff'); }
}
function newCop(delay=0) {
  const s = spotAround(p.x, p.y, 15, 650, 850);
  const c = { x:s.x, y:s.y, r:12, mounted:false, frozen:0, away:delay, arrest:0, shootCd:1, face:0, detour:0, dsign:1 };
  rollMounted(c); return c;
}
function reset() {
  p = { x:1800, y:1500, r:11, face:-Math.PI/2, car:null, arrest:0, slow:0, bump:0 };
  inv = { gun:0, sword:0, cash:0, cars:0 };
  t = 0; spawnT = 0; copT = 0; shopLock = false; copCarSaid = false;
  cash = []; msgs = []; fx = [];
  cars.forEach(c => { c.hp = CAR_MAX_HP; });
  cops = [newCop(), newCop()];
}
function say(text, color='#e9e6dc') { msgs.push({text, color, life:2.6}); if (msgs.length>4) msgs.shift(); }

function buy(item) {
  if (inv.cash < PRICE[item]) return say('Not enough cash for the ' + item, '#ffb3b3');
  inv.cash -= PRICE[item];
  if (item==='car') {
    const s = spotAround(p.x, p.y, 24, 40, 65);
    cars.push({x:s.x, y:s.y, a:0, hp:CAR_MAX_HP, color:'#d4382f'}); inv.cars++;
    say('Car delivered next to you. Press Shift to get in', '#b6f5c0');
  } else { inv[item]++; say('Bought ' + item + ' (-$' + PRICE[item] + ')', '#b6f5c0'); }
}
function closeShop() { state='play'; shopLock=true; }

function nearestCop() {
  let b=null, d=1e9;
  for (const c of cops) if (!c.away) { const k = dist(c,p); if (k<d) { d=k; b=c; } }
  return b;
}
function useGun() {
  if (inv.gun<1) return say('No gun. Buy one at the shop', '#ffb3b3');
  const c = nearestCop(); if (!c) return;
  inv.gun--; c.frozen = FREEZE;
  fx.push({type:'beam', x1:p.x, y1:p.y, x2:c.x, y2:c.y, life:.25, col:'#bfeaff'});
  say('Cop frozen for 5s', '#bfeaff');
}
function useSword() {
  if (inv.sword<1) return say('No sword. Buy one at the shop', '#ffb3b3');
  const c = nearestCop(); if (!c) return;
  inv.sword--; c.away = SWORD_RESPAWN; c.frozen = 0; c.arrest = 0;
  fx.push({type:'puff', x:c.x, y:c.y, life:.5});

const toC = t => { const b = cv.getBoundingClientRect(); return {x:(t.clientX-b.left)*W/b.width, y:(t.clientY-b.top)*H/b.height}; };
function startGame() { if (performance.now()-overAt>700) { reset(); state='play'; } }
function menuTap(mx,my) {
  const inR = r => mx>=r.x && mx<=r.x+r.w && my>=r.y && my<=r.y+r.h;

    const b = btnDefs().find(b => Math.hypot(q.x-b.x, q.y-b.y) < b.r+10);
    if (b) { if (b.k==='gun') useGun(); else if (b.k==='sword') useSword(); else toggleCar(); }
    else if (!joy.on && q.x < W*.6) { joy.on=true; joy.id=t.identifier; joy.cx=q.x; joy.cy=q.y; joy.x=joy.y=joy.dx=joy.dy=0; }
  }

    const q = toC(t), vx=q.x-joy.cx, vy=q.y-joy.cy, l=Math.hypot(vx,vy);
    if (l>12) { joy.x=vx/l; joy.y=vy/l; } else { joy.x=0; joy.y=0; }
    const m = Math.min(l,50); joy.dx = l ? vx/l*m : 0; joy.dy = l ? vy/l*m : 0;
  }
}, {passive:false});

// ---------- update ----------
function update(dt) {
  t += dt;
  p.slow = Math.max(0, p.slow-dt); p.bump = Math.max(0, p.bump-dt);
  let dx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0);
  let dy = (keys.s||keys.arrowdown?1:0) - (keys.w||keys.arrowup?1:0);
  if (joy.on && (joy.x||joy.y)) { dx=joy.x; dy=joy.y; }
  if (dx||dy) { const l=Math.hypot(dx,dy); dx/=l; dy/=l; p.face = Math.atan2(dy,dx);
    const sp = (p.car ? 290 : 190) * (p.slow>0 ? .4 : 1); move(p, dx*sp*dt, dy*sp*dt); }
  if (p.car) { p.car.x = p.x; p.car.y = p.y; p.car.a = p.face; }

  if (!inZone()) shopLock = false;
  else if (!shopLock) { state='shop'; return; }

  // pedestrians
  for (const q of peds) {
    if (q.stun>0) { q.stun-=dt; }
    else {
      q.ph += dt*6;
      const nx = q.x + (q.ax==='h'?q.dir*q.sp*dt:0), ny = q.y + (q.ax==='v'?q.dir*q.sp*dt:0);
      if (nx<20||nx>WW-20||ny<20||ny>WH-20||hitsWall(nx,ny,q.r-2)) q.dir*=-1; else { q.x=nx; q.y=ny; }
    }
    if (p.bump<=0 && Math.abs(q.x-p.x)<p.r+q.r && Math.abs(q.y-p.y)<p.r+q.r && dist(q,p)<p.r+q.r) {
      p.slow = 1.3; p.bump = .9; q.stun = 1.3;
      say(p.car ? 'You clipped a pedestrian! Slowed down' : 'Bumped into a pedestrian! Slowed down', '#ffd08a');
    }
  }

  spawnT -= dt;
  if (spawnT<=0 && cash.length<18) {
    const s = Math.random()<.7 ? spotAround(p.x,p.y,10,180,700) : spotAround(WW/2,WH/2,10,0,1300);
    cash.push({x:s.x,y:s.y,v:Math.round(rnd(1,5))*10,age:0}); spawnT = 1.1;
  }
  for (let i=cash.length-1;i>=0;i--) { const c=cash[i]; c.age+=dt;
    if (dist(c,p) < p.r+12) { inv.cash += c.v; say('+$'+c.v,'#b6f5c0'); cash.splice(i,1); }
    else if (c.age>35) cash.splice(i,1); }

  copT += dt;
  if (copT>18 && cops.length<9) { cops.push(newCop()); copT=0; say('Another cop joins the chase', '#a9c8ff'); }

  const speed = Math.min(150, 105 + t*0.4), mspeed = Math.min(240, 170 + t*0.3);
  let maxArrest = 0;
  for (const c of cops) {
    if (c.away>0) { c.away-=dt; if (c.away<=0) { const s=spotAround(p.x,p.y,15,650,850); c.x=s.x; c.y=s.y; c.away=0; rollMounted(c); } continue; }
    if (c.frozen>0) { c.frozen-=dt; continue; }
    const d = dist(c,p), ang = Math.atan2(p.y-c.y, p.x-c.x); c.face = ang;
    let sx=0, sy=0;
    for (const o of cops) if (o!==c && !o.away) { const k=dist(c,o); if (k<26&&k>0){ sx+=(c.x-o.x)/k; sy+=(c.y-o.y)/k; } }
    const chase = () => {
      let a = ang; if (c.detour>0) { c.detour-=dt; a += c.dsign*1.3; }
      const want = (c.mounted ? mspeed : speed)*dt;
      const got = move(c, Math.cos(a)*want + sx*40*dt, Math.sin(a)*want + sy*40*dt);
      if (c.detour<=0 && got < want*0.35) { c.detour=.7; c.dsign = Math.random()<.5?-1:1; }
    };
    if (c.mounted && !p.car && d<90) { c.mounted=false; c.r=12; fx.push({type:'puff',x:c.x,y:c.y,life:.5}); }
    if (p.car) {
      if (d>170) chase();
      c.arrest = 0;
      if (d<260) { c.shootCd -= dt;
        if (c.shootCd<=0) { c.shootCd = 1.3; p.car.hp--;
          fx.push({type:'beam', x1:c.x, y1:c.y, x2:p.x, y2:p.y, life:.15, col:'#ffd24a'});
          if (p.car.hp<=0) { cars.splice(cars.indexOf(p.car),1); p.car=null; p.r=11;
            say('Your car was destroyed!', '#ffb3b3'); fx.push({type:'puff',x:p.x,y:p.y,life:.6}); }
        } }
    } else {
      chase();
      if (d < c.r+p.r+2) c.arrest += dt; else c.arrest = Math.max(0, c.arrest-dt*1.5);
      maxArrest = Math.max(maxArrest, c.arrest);
      c.shootCd = .8;
    }
  }
  p.arrest = maxArrest / 0.7;
  if (maxArrest >= 0.7) { state='over'; overAt=performance.now(); best = Math.max(best, t); }

  msgs.forEach(m => m.life-=dt); msgs = msgs.filter(m=>m.life>0);
  fx.forEach(f => f.life-=dt); fx = fx.filter(f=>f.life>0);
}

  });
  g.fillStyle='#e9e6dc22'; g.fillRect(leaveRect.x,leaveRect.y,leaveRect.w,leaveRect.h);
  g.strokeStyle='#e9e6dc'; g.lineWidth=2; g.strokeRect(leaveRect.x,leaveRect.y,leaveRect.w,leaveRect.h);
  g.textAlign='center'; g.fillStyle='#fff'; g.font='bold 18px "Trebuchet MS", sans-serif';
  g.fillText('Back to the chase  (Enter / Esc)', leaveRect.x+leaveRect.w/2, leaveRect.y+30);
}
function overlay(title, lines, col) {
  const small = H<500, ty = small?78:170, ly = ty+(small?40:60), sp = small?25:30;
  g.fillStyle='#0b0c10dd'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle=col; g.font='bold '+(small?48:64)+'px Impact, "Arial Black", sans-serif';
  g.fillText(title, W/2, ty);
  g.fillStyle='#e9e6dc'; g.font=(small?16:18)+'px "Trebuchet MS", sans-serif';
  lines.forEach((l,i)=>g.fillText(l, W/2, ly+i*sp));
}
function draw() {
  cam.x = Math.max(0, Math.min(WW-W, p.x-W/2));
  cam.y = Math.max(0, Math.min(WH-H, p.y-H/2));
  g.drawImage(ground, cam.x, cam.y, W, H, 0, 0, W, H);
  g.save(); g.translate(-Math.round(cam.x), -Math.round(cam.y));
  g.strokeStyle='#f2c14e'; g.lineWidth=3; g.setLineDash([12,8]); g.globalAlpha=.65+.2*Math.sin(performance.now()/300);
  g.strokeRect(zone.x+2,zone.y+2,zone.w-4,zone.h-4); g.setLineDash([]); g.globalAlpha=1;
  g.fillStyle='#14161cbb'; g.font='bold 12px "Trebuchet MS", sans-serif'; g.textAlign='center';
  g.fillText('SHOP ENTRANCE', zone.x+zone.w/2, zone.y+zone.h/2+4);
  cars.forEach(c => { if (onScreen(c)) drawCarShape(c); });
  const nc = !p.car && state==='play' ? nearCar() : null;
  if (nc) { g.fillStyle='#14161ccc'; g.fillRect(nc.x-38,nc.y-40,76,18); g.fillStyle='#fff';
    g.font='bold 12px "Trebuchet MS", sans-serif'; g.textAlign='center'; g.fillText('Shift: drive', nc.x, nc.y-27); }
  peds.forEach(q => { if (onScreen(q)) drawPed(q); });
  cash.forEach(drawCash); cops.forEach(drawCop); drawPlayer(); drawFx();
  g.restore();
  drawHUD();
  if (state==='shop') drawShopMenu();
  if (state==='start') overlay('HEIST RUN', touchMode ? [
    'Grab the cash. Stay out of cuffs.',
    'Drag on the left side to move.',
    'Buttons on the right: gun, sword, drive / exit car.',
    'Walk into the Black Market on the main road to shop.',
    'Cops will chase you in police cars. Bumping people slows you.',
    '', 'Tap to start'] : [
    'Grab the cash. Stay out of cuffs.',
    'Move: WASD / Arrow keys',
    'Walk into the Black Market entrance on the main road to shop (game pauses).',
    'Space: gun (freeze nearest cop 5s)   Ctrl or Q: sword (nearest cop leaves)',
    'Shift: get into a parked car, or out of the one you are driving.',
    'In a car you cannot be arrested until cops shoot it 5 times.',
    'Cops start on foot, then hop into police cars as time goes on.',
    'Pedestrians on the sidewalks will slow you down if you bump into them.',
    '', 'Press Enter to start'], '#f2c14e');
  if (state==='over') overlay('BUSTED', [
    'You lasted ' + t.toFixed(1) + ' seconds',
    'Cash on hand: $' + inv.cash, 'Best: ' + best.toFixed(1) + 's', '', touchMode ? 'Tap to run again' : 'Press Enter to run again'], '#e5484d');
}

p = { x:1800, y:1500, car:null, r:11 };
layout();
buildWorld();
reset();
let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (state==='play' && !portrait) update(dt);
  draw(); requestAnimationFrame(loop);
})(last);
})();
</script>
</body>
</html>
